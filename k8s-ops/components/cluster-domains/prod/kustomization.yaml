apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Cluster-wide domain configuration for prod environment.
# TLS certificate is managed via TLSStore in kube-system (infrastructure/traefik/).
patches:
- target:
    kind: Ingress
    labelSelector: "ingress-type=external"
  patch: |
    - op: replace
      path: /spec/rules/0/host
      value: online.finpay.com.ua
- target:
    kind: IngressRoute
    name: transactions
  patch: |
    - op: replace
      path: /spec/routes/0/match
      value: "Host(`online.finpay.com.ua`) && PathRegexp(`^/api/v1/cards/[^/]+/transactions`)"
# Future: internal API (internal.finpay.com.ua:8443)
# Future: admin panel (admin.finpay.com.ua:8443)
