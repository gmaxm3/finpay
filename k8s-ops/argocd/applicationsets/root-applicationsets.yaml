apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-applicationsets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@bitbucket.org:Kapowai/finpaybank-gitops.git
    targetRevision: master
    path: k8s-ops/argocd/applicationsets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true