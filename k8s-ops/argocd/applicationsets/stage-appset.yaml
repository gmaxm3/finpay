apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: stage-appset
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: finpaybank
    environment: stage
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - zone: dmz
                  namespace: stage-dmz
                  server: "https://10.201.65.10:6443"
                - zone: cde
                  namespace: stage-cde
                  server: "https://10.201.66.10:6443"
          - git:
              repoURL: git@bitbucket.org:Kapowai/finpaybank-gitops.git
              revision: master
              directories:
                # Шукаємо сервіси в корені зони та окремо в папці _wip
                - path: "k8s-ops/apps/{{.zone}}/*"
                - path: "k8s-ops/apps/{{.zone}}/_wip/*"
                # Виключаємо службові папки
                - path: "k8s-ops/apps/{{.zone}}/_template"
                  exclude: true
                - path: "k8s-ops/apps/{{.zone}}/_wip/"
                  exclude: true

  template:
    metadata:
      name: "{{.path.basename}}-{{.zone}}-stage"
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: finpaybank
        app.kubernetes.io/name: "{{.path.basename}}"
        environment: stage
        zone: "{{.zone}}"
      annotations:
        notifications.argoproj.io/subscribe.on-sync-failed.slack: finpaybank-alerts
        notifications.argoproj.io/subscribe.on-sync-succeeded.slack: finpaybank-alerts
        kargo.akuity.io/authorized-stage: "{{.path.basename}}:stage"
    spec:
      project: stage-project
      source:
        repoURL: git@bitbucket.org:Kapowai/finpaybank-gitops.git
        targetRevision: master
        path: "{{.path.path}}/overlays/stage"
      destination:
        server: "{{.server}}"
        namespace: "{{.namespace}}"
      syncPolicy:
        automated: null  # Мануальний синк (оновлюється через Kargo)
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - ServerSideApply=true
        retry:
          limit: 2
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/volumeClaimTemplates