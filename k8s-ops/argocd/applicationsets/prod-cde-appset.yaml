apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prod-cde-appset
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: finpaybank
    environment: prod
    zone: cde
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]

  generators:
    - git:
        repoURL: git@bitbucket.org:Kapowai/finpaybank-gitops.git
        revision: master
        # prod-cde: тільки CDE сервіси
        directories:
          - path: "k8s-ops/apps/cde/*"
          - path: "k8s-ops/apps/cde/_template"
            exclude: true
          - path: "k8s-ops/apps/cde/_wip"
            exclude: true
        values:
          zone: cde
          serviceName: "{{.path.basename}}"

  template:
    metadata:
      name: "{{.path.basename}}-cde-prod"
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: finpaybank
        app.kubernetes.io/name: "{{.path.basename}}"
        environment: prod
        zone: cde
      annotations:
        notifications.argoproj.io/subscribe.on-sync-failed.slack: finpaybank-alerts
        notifications.argoproj.io/subscribe.on-sync-failed.pagerduty: ""
        notifications.argoproj.io/subscribe.on-sync-succeeded.slack: finpaybank-alerts
        notifications.argoproj.io/subscribe.on-health-degraded.pagerduty: ""
        kargo.akuity.io/authorized-stage: "{{.path.basename}}:prod"

    spec:
      project: prod-project

      source:
        repoURL: git@bitbucket.org:Kapowai/finpaybank-gitops.git
        targetRevision: master
        path: "{{.path.path}}/overlays/prod"

      destination:
        server: https://10.201.98.10:6443
        # prod-cde кластер: namespace "prod-cde"
        namespace: prod-cde

      # PROD CDE: НЕ automated, НЕ selfHeal
      # PCI-DSS: всі зміни в CDE — тільки через затверджений change management процес
      syncPolicy:
        automated: null
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 1
          backoff:
            duration: 60s
            factor: 1
            maxDuration: 60s

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        # StatefulSet: ігноруємо volumeClaimTemplates (immutable після створення)
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/volumeClaimTemplates
        - group: ""
          kind: Service
          jsonPointers:
            - /spec/clusterIP
            - /spec/clusterIPs
