apiVersion: apps/v1
kind: Deployment
metadata:
  name: static
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: static
    app.kubernetes.io/part-of: finpaybank
    zone: dmz
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: static
      zone: dmz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: static
        app.kubernetes.io/part-of: finpaybank
        zone: dmz
    spec:
      serviceAccountName: static
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: static
          image: finpaybank.kapowai.com.ua/static:26.03.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: static-config
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
#           livenessProbe:
#             httpGet:
#               path: /health
#               port: 80
#             initialDelaySeconds: 30
#             periodSeconds: 30
#             failureThreshold: 3
#           readinessProbe:
#             httpGet:
#               path: /ready
#               port: 80
#             initialDelaySeconds: 10
#             periodSeconds: 10
#           startupProbe:
#             httpGet:
#               path: /health
#               port: 80
#             failureThreshold: 30
#             periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
