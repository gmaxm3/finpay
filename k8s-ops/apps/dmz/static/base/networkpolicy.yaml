apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: static
  labels:
    app.kubernetes.io/name: static
    app.kubernetes.io/part-of: finpaybank
    zone: dmz
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: static
      zone: dmz
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              security-zone: dmz
      ports:
        - port: 80
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 80
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              security-zone: cde
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
      ports:
        - port: 5672
