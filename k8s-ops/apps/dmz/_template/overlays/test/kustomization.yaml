apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: test-dmz

resources:
  - ../../base

images:
  - name: hub.kapowai.com.ua/SERVICE_NAME
    newTag: "latest"

patches:
  - target:
      kind: Deployment
      name: SERVICE_NAME
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "300m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "384Mi"

  - target:
      kind: HorizontalPodAutoscaler
      name: SERVICE_NAME
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2

configMapGenerator:
  - name: SERVICE_NAME-config
    behavior: merge
    literals:
      - APP_ENV=test
      - LOG_LEVEL=info
      - RABBITMQ_HOST=rabbitmq.test-cde.svc.cluster.local
