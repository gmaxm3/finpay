apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stage-dmz

resources:
  - ../../base

images:
  - name: hub.kapowai.com.ua/SERVICE_NAME
    newTag: "latest"

patches:
  - target:
      kind: Deployment
      name: SERVICE_NAME
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"

  - target:
      kind: HorizontalPodAutoscaler
      name: SERVICE_NAME
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5

  # PDB для stage: мінімум 50% подів доступні
  - target:
      kind: PodDisruptionBudget
      name: SERVICE_NAME
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: "50%"

configMapGenerator:
  - name: SERVICE_NAME-config
    behavior: merge
    literals:
      - APP_ENV=stage
      - LOG_LEVEL=info
      - RABBITMQ_HOST=rabbitmq.stage-cde.svc.cluster.local
