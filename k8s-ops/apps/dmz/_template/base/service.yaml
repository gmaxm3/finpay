apiVersion: v1
kind: Service
metadata:
  name: SERVICE_NAME
  labels:
    app.kubernetes.io/name: SERVICE_NAME
    app.kubernetes.io/component: SERVICE_NAME
    app.kubernetes.io/part-of: finpaybank
    zone: dmz
spec:
  # ClusterIP — внутрішній доступ; Ingress виставляє назовні
  type: ClusterIP
  selector:
    app.kubernetes.io/name: SERVICE_NAME
    zone: dmz
  ports:
    - name: http
      port: 80
      targetPort: SERVICE_PORT
      protocol: TCP
