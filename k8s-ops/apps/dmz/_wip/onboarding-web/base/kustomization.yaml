apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - rbac.yaml
configMapGenerator:
  - name: onboarding-web-config
    literals:
      - APP_ENV=production
      - LOG_LEVEL=info
      - RABBITMQ_HOST=rabbitmq.svc.cluster.local
      - RABBITMQ_PORT=5672
commonLabels:
  app.kubernetes.io/part-of: finpaybank
  zone: dmz
