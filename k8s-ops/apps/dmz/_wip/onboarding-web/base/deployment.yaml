apiVersion: apps/v1
kind: Deployment
metadata:
  name: onboarding-web
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: onboarding-web
    app.kubernetes.io/part-of: finpaybank
    zone: dmz
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: onboarding-web
      zone: dmz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onboarding-web
        app.kubernetes.io/part-of: finpaybank
        zone: dmz
    spec:
      serviceAccountName: onboarding-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: onboarding-web
          image: finpay.kapowai.com.ua/finpaybank/webviews-on-boarding:1.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: onboarding-web-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
#           livenessProbe:
#             httpGet:
#               path: /health
#               port: 80
#             initialDelaySeconds: 30
#             periodSeconds: 30
#             failureThreshold: 3
#           readinessProbe:
#             httpGet:
#               path: /ready
#               port: 80
#             initialDelaySeconds: 10
#             periodSeconds: 10
#           startupProbe:
#             httpGet:
#               path: /health
#               port: 80
#             failureThreshold: 30
#             periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
