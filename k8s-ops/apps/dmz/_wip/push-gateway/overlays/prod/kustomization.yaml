apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod-dmz
resources:
  - ../../base
  - secret-google.yaml
images:
  - name: finpaybank.kapowai.com.ua/push-gateway
    newTag: "26.01.1"
configMapGenerator:
  - name: push-gateway-settings
    behavior: merge
    literals:
      - APP_ENV=prod
      - RABBITMQ_HOST=rabbitmq.prod-cde.svc.cluster.local
