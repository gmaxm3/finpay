apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: sms
    app.kubernetes.io/part-of: finpaybank
    zone: dmz
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sms
      zone: dmz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sms
        app.kubernetes.io/part-of: finpaybank
        zone: dmz
    spec:
      serviceAccountName: sms
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: sms
          image: hub.kapowai.com.ua/sms:26.02.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: sms-config
            - secretRef:
                name: shared-secrets
            - secretRef:
                name: sms-credentials
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
#           livenessProbe:
#             httpGet:
#               path: /health
#               port: 8000
#             initialDelaySeconds: 30
#             periodSeconds: 30
#             failureThreshold: 3
#           readinessProbe:
#             httpGet:
#               path: /ready
#               port: 8000
#             initialDelaySeconds: 10
#             periodSeconds: 10
#           startupProbe:
#             httpGet:
#               path: /health
#               port: 8000
#             failureThreshold: 30
#             periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
