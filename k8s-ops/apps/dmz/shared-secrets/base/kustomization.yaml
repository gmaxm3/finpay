apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# shared-secrets — централізований Secret для всіх DMZ сервісів.
#
# Містить: RABBITMQ_URL, REDIS_URL
#
# Кожен overlay має своє зашифроване secret-shared.yaml (SOPS + age).
# Редагування: sops k8s-ops/apps/dmz/shared-secrets/overlays/{env}/secret-shared.yaml
#
# Сервіси підключають через:
#   envFrom:
#     - secretRef:
#         name: shared-secrets

commonLabels:
  app.kubernetes.io/part-of: finpaybank
  zone: dmz
