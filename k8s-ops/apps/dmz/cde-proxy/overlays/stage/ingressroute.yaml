---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: cde-transport
  namespace: stage-dmz
spec:
  serverName: online-stage.finpay.com.ua
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cde-proxy
  namespace: stage-dmz
  labels:
    app.kubernetes.io/name: cde-proxy
    app.kubernetes.io/part-of: finpaybank
    zone: dmz
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`online-stage.finpay.com.ua`) && PathPrefix(`/api/`)
      kind: Rule
      services:
        - name: cde-traefik
          port: 30443
          scheme: https
          serversTransport: cde-transport
          passHostHeader: true
  tls:
    secretName: finpay-wildcard-tls
