apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev-cde
resources:
- ../../base
images:
- name: finpaybank.kapowai.com.ua/banks
  newTag: 26.5.3
configMapGenerator:
- name: banks-config
  behavior: merge
  literals:
  - APP_ENV=dev
  - ES_URL=http://10.201.3.41:9200
  - BANKS_ES_PREFIX=dev
patches:
- target:
    kind: NetworkPolicy
    name: banks
  patch: |-
    - op: replace
      path: /spec/egress/4/to/0/ipBlock/cidr
      value: 10.201.3.41/32
