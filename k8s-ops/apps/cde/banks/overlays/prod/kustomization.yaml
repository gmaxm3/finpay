apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod-cde
resources:
  - ../../base
  - secret-banks.yaml
images:
  - name: finpaybank.kapowai.com.ua/banks
    newTag: 26.5.3
configMapGenerator:
  - name: banks-config
    behavior: merge
    literals:
      - APP_ENV=prod
      - BANKS_ES_PREFIX=prod

patches:
  - target:
      kind: NetworkPolicy
      name: banks
    patch: |-
      - op: replace
        path: /spec/egress/4/to/0/ipBlock/cidr
        value: 10.201.98.21/32
  - target:
      kind: Ingress
      name: banks
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: online.finpay.com.ua
  - target:
      kind: Deployment
      name: banks
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: ES_URL
            valueFrom:
              secretKeyRef:
                name: banks-credentials
                key: ES_URL
