apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webplatform-egress
  labels:
    app.kubernetes.io/part-of: finpaybank
    zone: cde
spec:
  podSelector:
    matchLabels:
      webplatform: enabled
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.1/32   # placeholder: замінюється в overlay
      ports:
        - port: 80
          protocol: TCP
