apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev-cde

resources:
  - ../../base

patches:
  - target:
      kind: NetworkPolicy
      name: cde-common-egress
    patch: |-
      - op: replace
        path: /spec/egress/1/to/0/ipBlock/cidr
        value: REPLACE_DEV_POSTGRES_IP/32
  - target:
      kind: NetworkPolicy
      name: webplatform-egress
    patch: |-
      - op: replace
        path: /spec/egress/0/to/0/ipBlock/cidr
        value: 10.200.1.100/32 # webplatform
