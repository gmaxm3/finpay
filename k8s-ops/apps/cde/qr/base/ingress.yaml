apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qr
  labels:
    app.kubernetes.io/name: qr
    app.kubernetes.io/part-of: finpaybank
    zone: cde
    ingress-type: external
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: REPLACE_ONLINE_HOST
      http:
        paths:
          - path: /api/v1/qr
            pathType: Prefix
            backend:
              service:
                name: qr
                port:
                  number: 8000
