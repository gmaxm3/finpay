apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stage-cde
resources:
  - ../../base
images:
  - name: finpaybank.kapowai.com.ua/finpay-qr
    newTag: "latest"
configMapGenerator:
  - name: qr-config
    behavior: merge
    literals:
      - APP_ENV=stage

patches:
  - target:
      kind: Ingress
      name: qr
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: online-stage.finpay.com.ua
