apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - statefulset.yaml
  - service.yaml
  - networkpolicy.yaml
  - rbac.yaml
  # Secret створюється через bootstrap-secrets.sh (SOPS+age):
  #   infrastructure/secrets/bootstrap-secrets.sh
  # Після bootstrap кожен overlay матиме: secret-rabbitmq.yaml (зашифрований)

configMapGenerator:
  - name: rabbitmq-config
    literals:
      - RABBITMQ_LOGS=-
  - name: rabbitmq-config-files
    files:
      - 10-defaults.conf

commonLabels:
  app.kubernetes.io/part-of: finpaybank
  zone: cde
