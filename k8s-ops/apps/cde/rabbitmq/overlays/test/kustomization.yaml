apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: test-cde

resources:
  - secret-rabbitmq.yaml
  - ../../base

images:
  - name: finpaybank.kapowai.com.ua/rabbitmq
    newTag: 4.2.6-management

patches:
  - target:
      kind: StatefulSet
      name: rabbitmq
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
