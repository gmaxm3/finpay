apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: test-cde
resources:
- ../../base
images:
- name: finpaybank.kapowai.com.ua/banks-worker
  newTag: 26.5.3
configMapGenerator:
- name: banks-worker-config
  behavior: merge
  literals:
  - APP_ENV=test
  - ES_URL=http://10.201.3.41:9200
  - BANKS_ES_PREFIX=test
patches:
- target:
    kind: NetworkPolicy
    name: banks-worker
  patch: |-
    - op: replace
      path: /spec/egress/4/to/0/ipBlock/cidr
      value: 10.201.3.41/32
- target:
    kind: Deployment
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "50m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "500m"
