apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stage-cde
resources:
  - ../../base
images:
  - name: finpaybank.kapowai.com.ua/cards
    newTag: "26.4.2"
configMapGenerator:
  - name: cards-config
    behavior: merge
    literals:
      - APP_ENV=stage

patches:
  - target:
      kind: Ingress
      name: cards
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: online-stage.finpay.com.ua
