apiVersion: apps/v1
kind: Deployment
metadata:
  name: ukrcard
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: ukrcard
    app.kubernetes.io/component: esb
    app.kubernetes.io/part-of: finpaybank
    zone: cde
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ukrcard
      zone: cde
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ukrcard
        app.kubernetes.io/component: esb
        app.kubernetes.io/part-of: finpaybank
        zone: cde
    spec:
      serviceAccountName: ukrcard
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: dedicated
                    operator: NotIn
                    values: [data]
      hostAliases:
        - ip: "10.0.8.227"
          hostnames:
            - "nsuapi.ukrcard.com.ua"
        - ip: "10.0.11.8"
          hostnames:
            - "uapi2.ukrcard.com.ua"
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: ukrcard
          image: finpaybank.kapowai.com.ua/ukrcard:None
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ukrcard-config
            - secretRef:
                name: shared-secrets
            - secretRef:
                name: ukrcard-credentials
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
#           livenessProbe:
#             httpGet:
#               path: /health
#               port: 8000
#             initialDelaySeconds: 30
#             periodSeconds: 30
#             failureThreshold: 3
#           readinessProbe:
#             httpGet:
#               path: /ready
#               port: 8000
#             initialDelaySeconds: 10
#             periodSeconds: 10
#           startupProbe:
#             httpGet:
#               path: /health
#               port: 8000
#             failureThreshold: 30
#             periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ukrcard-certs
              mountPath: /app/settings
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ukrcard-certs
          secret:
            secretName: ukrcard-certs
