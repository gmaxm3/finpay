apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - rbac.yaml
configMapGenerator:
  - name: kyc-api-config
    literals:
      - APP_ENV=production
      - LOG_LEVEL=info
      - MINIO_BUCKET=kycmedia
      - MINIO_SSL=False
      - DIIA_LOG_SIGNED_FILES=True
      - LIVENESS_HOST=https://liveness.finpay.com.ua
commonLabels:
  app.kubernetes.io/part-of: finpaybank
  zone: cde