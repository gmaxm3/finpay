apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - rbac.yaml
configMapGenerator:
  - name: kyc-liveness-service-config
    literals:
      - APP_ENV=production
      - LIVENESS_HOST=https://liveness.finpay.com.ua/
      - MINIO__BUCKET=liveness
      - MINIO__SECURE=false
commonLabels:
  app.kubernetes.io/part-of: finpaybank
  zone: cde