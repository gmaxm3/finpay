apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyc-liveness-service
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: kyc-liveness-service
    app.kubernetes.io/component: esb
    app.kubernetes.io/part-of: finpaybank
    zone: cde

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: kyc-liveness-service
      zone: cde

  template:
    metadata:
      labels:
        app.kubernetes.io/name: kyc-liveness-service
        app.kubernetes.io/component: esb
        app.kubernetes.io/part-of: finpaybank
        zone: cde

    spec:
      serviceAccountName: kyc-liveness-service
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: Always
        seccompProfile:
          type: RuntimeDefault

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: dedicated
                    operator: NotIn
                    values:
                      - data

      imagePullSecrets:
        - name: registry-credentials

      containers:
        - name: kyc-liveness-service
          image: hub.kapowai.com.ua/kyc-liveness-service:25.08.01

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - secretRef:
                name: shared-secrets
            - configMapRef:
                name: kyc-liveness-service-config

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          volumeMounts:
            - name: tmp
              mountPath: /tmp

            - name: deepface-cache
              mountPath: /.deepface

            - name: config-cache
              mountPath: /.config

            - name: dot-cache
              mountPath: /.cache

            - name: shared-data
              mountPath: /app/data

      volumes:
        - name: tmp
          emptyDir: {}

        - name: deepface-cache
          emptyDir: {}

        - name: config-cache
          emptyDir: {}

        - name: dot-cache
          emptyDir: {}

        - name: shared-data
          hostPath:
            path: /opt/kyc-liveness-data
            type: DirectoryOrCreate