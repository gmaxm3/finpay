apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: test-cde
resources:
  - ../../base
  - secret-kyc-livenes.yaml
images:
  - name: hub.kapowai.com.ua/kyc-liveness-service
    newTag: "25.08.01"
configMapGenerator:
  - name: kyc-liveness-service-config
    behavior: merge
    literals:
      - APP_ENV=test
      - LIVENESS_HOST=https://liveness-dev.finpay.com.ua/
patches:
  - target:
      kind: Deployment
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"