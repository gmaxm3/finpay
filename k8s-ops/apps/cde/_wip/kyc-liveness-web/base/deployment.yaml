apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyc-liveness-web
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: kyc-liveness-web
    app.kubernetes.io/component: esb
    app.kubernetes.io/part-of: finpaybank
    zone: cde
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kyc-liveness-web
      zone: cde
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kyc-liveness-web
        app.kubernetes.io/component: esb
        app.kubernetes.io/part-of: finpaybank
        zone: cde
    spec:
      serviceAccountName: kyc-liveness-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: dedicated
                    operator: NotIn
                    values: [data]
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: kyc-liveness-web
          image: hub.kapowai.com.ua/kyc-liveness-web:25.08.01
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETUID, SETGID]
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: kyc-liveness-web-config
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}