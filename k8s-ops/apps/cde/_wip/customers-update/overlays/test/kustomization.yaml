apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: test-cde
resources:
  - ../../base
images:
  - name: finpaybank.kapowai.com.ua/customers-update
    newTag: "26.01.7"
configMapGenerator:
  - name: customers-update-config
    behavior: merge
    literals:
      - APP_ENV=test
patches:
  - target:
      kind: Deployment
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
