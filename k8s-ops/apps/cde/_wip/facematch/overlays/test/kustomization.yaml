apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: test-cde
resources:
  - ../../base
images:
  - name: hub.kapowai.com.ua/facematch
    newTag: "2026.3.3"
patches:
  - target:
      kind: Deployment
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"