apiVersion: apps/v1
kind: Deployment
metadata:
  name: facematch
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: facematch
    app.kubernetes.io/component: esb
    app.kubernetes.io/part-of: finpaybank
    zone: cde
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: facematch
      zone: cde
  template:
    metadata:
      labels:
        app.kubernetes.io/name: facematch
        app.kubernetes.io/component: esb
        app.kubernetes.io/part-of: finpaybank
        zone: cde
    spec:
      serviceAccountName: facematch
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: dedicated
                    operator: NotIn
                    values: [data]
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: facematch
          image: hub.kapowai.com.ua/facematch:2026.3.3
          command: ["facematch", "run", "api"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HOME
              value: "/models-home"
            - name: TORCHINDUCTOR_CACHE_DIR
              value: "/tmp/torch-cache"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: models
              mountPath: /models-home
          volumes:
            - name: tmp
              emptyDir: { }
            - name: models
              hostPath:
                path: /opt/facematch-models
                type: Directory
      volumes:
        - name: tmp
          emptyDir: {}
        - name: models
          hostPath:
            path: /opt/facematch-models
            type: Directory