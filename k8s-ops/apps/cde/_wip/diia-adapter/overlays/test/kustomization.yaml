apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: test-cde

resources:
  - ../../base
  - secret-diia-adapter.yaml
  - secret-application.yaml

configMapGenerator:
  - name: diia-adapter-config
    behavior: merge
    literals:
      - APP_ENV=test
      - RETURN_LINK=https://online.finpay.com.ua/deeplinks/onboarding/diia-sharing
      - DEFAULT_RETURN_DOMAIN=http://10.201.1.10
      - WEBHOOK_DOMAIN=http://10.201.1.10
      - WEBHOOK_ENDPOINT=/webhooks/dia
      - SIGN_WEBHOOK_ENDPOINT=/webhooks/dia-sign
      - SIGN_RETURN_LINK=https://online.finpay.com.ua/deeplinks/onboarding/diia-sign
      - LOGGING_FILE_NAME=/app/var/log/diia-adapter.log
      - LOG_FILE=/app/var/log/diia-adapter.log