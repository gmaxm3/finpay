apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stage-cde
resources:
  - ../../base
images:
  - name: finpaybank.kapowai.com.ua/onboarding
    newTag: 26.5.12
configMapGenerator:
  - name: onboarding-config
    behavior: merge
    literals:
      - APP_ENV=stage

patches:
  - target:
      kind: Ingress
      name: onboarding
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: online-stage.finpay.com.ua
