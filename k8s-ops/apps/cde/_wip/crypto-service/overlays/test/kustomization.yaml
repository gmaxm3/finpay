apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: test-cde
resources:
  - ../../base
  - secret-crypto-service.yaml
images:
  - name: hub.kapowai.com.ua/crypto-service
    newTag: "26.6.1"
configMapGenerator:
  - name: crypto-service-config
    behavior: merge
    literals:
      - APP_ENV=test
patches:
  - target:
      kind: Deployment
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"