apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto-service
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: crypto-service
    app.kubernetes.io/component: esb
    app.kubernetes.io/part-of: finpaybank
    zone: cde
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crypto-service
      zone: cde
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crypto-service
        app.kubernetes.io/component: esb
        app.kubernetes.io/part-of: finpaybank
        zone: cde
    spec:
      serviceAccountName: crypto-service
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: dedicated
                    operator: NotIn
                    values:
                      - data
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: crypto-service
          image: hub.kapowai.com.ua/crypto-service:26.6.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: crypto-service-config
            - secretRef:
                name: crypto-service-credentials
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}