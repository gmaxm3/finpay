apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - rbac.yaml
configMapGenerator:
  - name: maintenance-config
    literals:
      - APP_ENV=production
      - LOG_LEVEL=info
      - RABBITMQ_HOST=rabbitmq.svc.cluster.local
      - RABBITMQ_PORT=5672
      - REDIS_HOST=redis.svc.cluster.local
      - REDIS_PORT=6379
      - DB_HOST=10.201.35.10
      - DB_PORT=5432
commonLabels:
  app.kubernetes.io/part-of: finpaybank
  zone: cde
