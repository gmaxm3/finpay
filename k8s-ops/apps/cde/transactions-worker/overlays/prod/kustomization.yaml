apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod-cde
resources:
  - ../../base
  - secret-transactions-worker.yaml
images:
  - name: finpaybank.kapowai.com.ua/transactions-worker
    newTag: "latest"
configMapGenerator:
  - name: transactions-worker-config
    behavior: merge
    literals:
      - APP_ENV=prod
patches:
  - target:
      kind: NetworkPolicy
      name: transactions-worker
    patch: |
      - op: add
        path: /spec/egress/-
        value:
          to:
            - ipBlock:
                cidr: REPLACE_KAFKA_IP_PROD/32
          ports:
            - port: 9092
