---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: SERVICE_NAME
  labels:
    app.kubernetes.io/name: SERVICE_NAME
    app.kubernetes.io/part-of: finpaybank
    zone: cde
automountServiceAccountToken: false
---
# CDE сервіси зазвичай не потребують доступу до K8s API взагалі
# Залишити rules пустим якщо не потрібно
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: SERVICE_NAME
  labels:
    app.kubernetes.io/name: SERVICE_NAME
    app.kubernetes.io/part-of: finpaybank
    zone: cde
rules:
  # Мінімальний доступ до власного ConfigMap
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["SERVICE_NAME-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: SERVICE_NAME
  labels:
    app.kubernetes.io/name: SERVICE_NAME
    app.kubernetes.io/part-of: finpaybank
    zone: cde
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: SERVICE_NAME
subjects:
  - kind: ServiceAccount
    name: SERVICE_NAME
