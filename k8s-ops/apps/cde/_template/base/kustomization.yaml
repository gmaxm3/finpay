apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - rbac.yaml
  - pdb.yaml
  # HPA не включено в CDE за замовчуванням — ESB сервіси зазвичай stateful-aware
  # Додати hpa.yaml якщо сервіс stateless і підтримує горизонтальне масштабування

configMapGenerator:
  - name: SERVICE_NAME-config
    literals:
      - APP_ENV=production
      - LOG_LEVEL=info
      - SERVICE_PORT=SERVICE_PORT
      # DB підключення (credentials через SOPS secret у overlay)
      - DB_HOST=10.201.35.10
      - DB_PORT=5432
      - DB_NAME=finpaybank
      # RabbitMQ (credentials через SOPS secret у overlay)
      - RABBITMQ_HOST=rabbitmq.svc.cluster.local
      - RABBITMQ_PORT=5672
      - RABBITMQ_VHOST=/SERVICE_NAME
      # Redis (credentials через SOPS secret у overlay)
      - REDIS_HOST=redis.svc.cluster.local
      - REDIS_PORT=6379

commonLabels:
  app.kubernetes.io/part-of: finpaybank
  zone: cde
