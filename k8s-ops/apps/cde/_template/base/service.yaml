apiVersion: v1
kind: Service
metadata:
  name: SERVICE_NAME
  labels:
    app.kubernetes.io/name: SERVICE_NAME
    app.kubernetes.io/component: SERVICE_NAME
    app.kubernetes.io/part-of: finpaybank
    zone: cde
spec:
  # CDE: тільки ClusterIP — немає публічного доступу
  type: ClusterIP
  selector:
    app.kubernetes.io/name: SERVICE_NAME
    zone: cde
  ports:
    - name: http
      port: 8000
      targetPort: SERVICE_PORT
      protocol: TCP
