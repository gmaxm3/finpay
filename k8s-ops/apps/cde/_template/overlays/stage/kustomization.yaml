apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stage-cde

resources:
  - ../../base

images:
  - name: hub.kapowai.com.ua/SERVICE_NAME
    newTag: "latest"

patches:
  - target:
      kind: Deployment
      name: SERVICE_NAME
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"

  - target:
      kind: PodDisruptionBudget
      name: SERVICE_NAME
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: "50%"

configMapGenerator:
  - name: SERVICE_NAME-config
    behavior: merge
    literals:
      - APP_ENV=stage
      - LOG_LEVEL=info
      - DB_HOST=REPLACE_STAGE_POSTGRES_IP
