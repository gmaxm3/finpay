apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: test-cde

resources:
  - ../../base

images:
  - name: hub.kapowai.com.ua/SERVICE_NAME
    newTag: "latest"

patches:
  - target:
      kind: Deployment
      name: SERVICE_NAME
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "768Mi"

configMapGenerator:
  - name: SERVICE_NAME-config
    behavior: merge
    literals:
      - APP_ENV=test
      - LOG_LEVEL=info
      - DB_HOST=REPLACE_TEST_POSTGRES_IP
