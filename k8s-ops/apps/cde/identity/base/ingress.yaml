apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: finpaybank
    zone: cde
    ingress-type: external
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: REPLACE_ONLINE_HOST
      http:
        paths:
          - path: /api/v1/oauth/token
            pathType: Prefix
            backend:
              service:
                name: identity
                port:
                  number: 8000
          - path: /api/v1/devices
            pathType: Prefix
            backend:
              service:
                name: identity
                port:
                  number: 8000
          - path: /api/v1/user
            pathType: Prefix
            backend:
              service:
                name: identity
                port:
                  number: 8000
          - path: /api/v1/mfa/challenge
            pathType: Prefix
            backend:
              service:
                name: identity
                port:
                  number: 8000
          - path: /api/v1/oauth/clients
            pathType: Prefix
            backend:
              service:
                name: identity
                port:
                  number: 8000