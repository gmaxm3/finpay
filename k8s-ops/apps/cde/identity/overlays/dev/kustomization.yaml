apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev-cde
resources:
- ../../base
images:
- name: hub.kapowai.com.ua/identity
  newTag: 26.5.4
configMapGenerator:
- name: identity-config
  behavior: merge
  literals:
  - APP_ENV=dev
  - OTP_BACKEND='totp'
  - OTP_DIGITS='6'
  - OTP_PERIOD='120'
  - TRUSTED_DEVICES_CONFIRM=False
