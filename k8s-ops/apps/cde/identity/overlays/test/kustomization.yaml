apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: test-cde
resources:
- ../../base
images:
- name: hub.kapowai.com.ua/identity
  newTag: 26.5.2
configMapGenerator:
- name: identity-config
  behavior: merge
  literals:
  - APP_ENV=test
  - OTP_BACKEND='totp'
  - OTP_DIGITS='6'
  - OTP_PERIOD='120'
  - TRUSTED_DEVICES_CONFIRM=False
patches:
- target:
    kind: Deployment
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "50m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "500m"
