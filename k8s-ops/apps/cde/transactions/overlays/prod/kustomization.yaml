apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod-cde
resources:
  - ../../base
  - secret-transactions.yaml
images:
  - name: finpaybank.kapowai.com.ua/transactions
    newTag: "latest"
configMapGenerator:
  - name: transactions-config
    behavior: merge
    literals:
      - APP_ENV=prod

patches:
  - target:
      kind: Ingress
      name: transactions
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: online.finpay.com.ua

  - target:
      kind: IngressRoute
      name: transactions
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`online.finpay.com.ua`) && PathRegexp(`^/api/v1/cards/[^/]+/transactions`)
