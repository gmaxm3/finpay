apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: test-cde
resources:
- ../../base
images:
- name: finpaybank.kapowai.com.ua/cards-worker
  newTag: 26.6.3
configMapGenerator:
- name: cards-worker-config
  behavior: merge
  literals:
  - APP_ENV=test
patches:
- target:
    kind: Deployment
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "50m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "500m"
