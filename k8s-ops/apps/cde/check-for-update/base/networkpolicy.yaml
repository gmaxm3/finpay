apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: check-for-update
  labels:
    app.kubernetes.io/name: check-for-update
    app.kubernetes.io/part-of: finpaybank
    zone: cde
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: check-for-update
      zone: cde
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              security-zone: cde
      ports:
        - port: 8000
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
      ports:
        - port: 5672
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
    - to:
        - ipBlock:
            cidr: 10.201.35.10/32
      ports:
        - port: 5432
