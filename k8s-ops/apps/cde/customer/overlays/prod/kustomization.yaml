apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod-cde
resources:
  - ../../base
images:
  - name: finpaybank.kapowai.com.ua/customer
    newTag: 26.5.1
configMapGenerator:
  - name: customer-config
    behavior: merge
    literals:
      - APP_ENV=prod

patches:
  - target:
      kind: Ingress
      name: customer
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: online.finpay.com.ua
