apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod-cde

resources:
  - secret-redis.yaml
  - ../../base

images:
  - name: finpaybank.kapowai.com.ua/redis
    newTag: "8.6.2"

patches:
  - target:
      kind: StatefulSet
      name: redis
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "4Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "1Gi"

configMapGenerator:
  - name: redis-config
    behavior: merge
    literals:
      - APP_ENV=prod
