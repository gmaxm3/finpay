---
# ClusterIssuer для Let's Encrypt — для DMZ сервісів з публічними доменами
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: finpaybank
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: vladimir.fesik@kapowai.online
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
---
# Staging issuer для тестування (без rate limits)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/part-of: finpaybank
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: vladimir.fesik@kapowai.online
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
