---
# ConfigMap з описом dashboards для Grafana
# Реальні JSON dashboard файли розміщувати в:
#   infrastructure/monitoring/dashboards/*.json
#
# Grafana Sidecar підхоплює ConfigMaps з label grafana_dashboard: "1"
apiVersion: v1
kind: ConfigMap
metadata:
  name: finpaybank-dashboards-config
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: finpaybank
    # Цей label підхоплює grafana sidecar dashboard provider
    grafana_dashboard: "1"
data:
  # Список dashboards та їх джерела (Grafana.com IDs або кастомні JSON)
  dashboards.yaml: |
    # Офіційні Grafana dashboards (завантажуються автоматично):
    # - Kubernetes Cluster Overview: ID 7249
    # - Node Exporter Full: ID 1860
    # - kube-state-metrics: ID 13332
    # - ArgoCD: ID 14584
    # - Loki Logs: ID 13639
    #
    # Кастомні dashboards finpaybank:
    # Розмістити JSON файли в infrastructure/monitoring/dashboards/
    # та додати їх в окремий ConfigMap з label grafana_dashboard: "1"
    #
    # Приклад:
    #   kubectl create configmap finpaybank-overview \
    #     --from-file=overview.json=infrastructure/monitoring/dashboards/overview.json \
    #     -n monitoring
    #   kubectl label configmap finpaybank-overview \
    #     grafana_dashboard=1 -n monitoring
---
# Grafana datasources — автоматична конфігурація
apiVersion: v1
kind: ConfigMap
metadata:
  name: finpaybank-grafana-datasources
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: finpaybank
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://kube-prometheus-stack-prometheus:9090
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: 30s

      - name: Loki
        type: loki
        url: http://loki-stack:3100
        access: proxy
        jsonData:
          maxLines: 1000
          # Відображати logs разом з метриками по namespace label
          derivedFields:
            - datasourceUid: Prometheus
              matcherRegex: "namespace=(\\w+)"
              name: namespace
              url: ""

      - name: Alertmanager
        type: alertmanager
        url: http://kube-prometheus-stack-alertmanager:9093
        access: proxy
        jsonData:
          implementation: prometheus
