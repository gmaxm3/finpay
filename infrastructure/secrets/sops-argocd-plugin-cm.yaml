---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmp-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: finpaybank
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: kustomize-sops
    spec:
      version: v1.0
      generate:
        command: [sh, -c]
        args:
          - |
            for env in dev test stage prod; do
              case "$PWD" in
                */overlays/$env|*/overlays/${env}/*)
                  component="../../../../../components/cluster-domains/$env"
                  if [ -d "$component" ]; then
                    kustomize edit add component "$component" 2>/dev/null || true
                  fi
                  break
                  ;;
              esac
            done
            find . -name "secret*.yaml" | while read -r f; do
              if grep -q "^sops:" "$f" 2>/dev/null; then
                sops --decrypt --in-place "$f"
              fi
            done
            kubectl kustomize .
      discover:
        find:
          glob: "**/kustomization.yaml"
