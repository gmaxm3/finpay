---
# Strategic merge patch for argocd-repo-server
# initContainer copies sops binary; sidecar runs argocd-cmp-server with kubectl+sops
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      volumes:
        - name: sops-age-key
          secret:
            secretName: sops-age-key
        - name: custom-tools
          emptyDir: {}
        - name: cmp-tmp
          emptyDir: {}
        - name: argocd-cmp-cm
          configMap:
            name: argocd-cmp-cm

      initContainers:
        - name: copy-sops
          image: ghcr.io/getsops/sops:v3.9.0
          command: [cp, /usr/local/bin/sops, /custom-tools/sops]
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools

      containers:
        - name: kustomize-sops
          # alpine/k8s has kubectl (kustomize built-in) + standard tools
          image: alpine/k8s:1.28.15
          command: [/var/run/argocd/argocd-cmp-server]
          env:
            - name: SOPS_AGE_KEY_FILE
              value: /sops-age-key/key.txt
            - name: PATH
              value: /custom-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: sops-age-key
              mountPath: /sops-age-key
              readOnly: true
            - name: custom-tools
              mountPath: /custom-tools
            - name: cmp-tmp
              mountPath: /tmp
            - name: var-files
              mountPath: /var/run/argocd
            - name: plugins
              mountPath: /home/argocd/cmp-server/plugins
            - name: argocd-cmp-cm
              mountPath: /home/argocd/cmp-server/config/plugin.yaml
              subPath: plugin.yaml
