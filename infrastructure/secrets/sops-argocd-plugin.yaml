---
# SOPS + age ArgoCD Config Management Plugin
#
# Підключає sops decrypt до argocd-repo-server через sidecar CMP.
# Age private key зберігається як Secret "sops-age-key" в namespace argocd.
#
# Bootstrap (після запуску bootstrap-secrets.sh):
#
#   kubectl create secret generic sops-age-key \
#     --namespace argocd \
#     --from-file=key.txt=infrastructure/secrets/.argocd-age-key.txt
#
#   kubectl apply -k infrastructure/secrets/
#
# Після apply: argocd-repo-server перезапуститься з sidecar + age key.

# ConfigMap з визначенням плагіна
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmp-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: finpaybank
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: kustomize-sops
    spec:
      version: v1.0
      generate:
        command: [sh, -c]
        args:
          - |
            # Decrypt всіх sops-зашифрованих yaml файлів перед kustomize build.
            # ArgoCD клонує репо у тимчасову директорію — in-place decrypt безпечний.
            find . -name "secret*.yaml" | while read -r f; do
              if grep -q "^sops:" "$f" 2>/dev/null; then
                sops --decrypt --in-place "$f"
              fi
            done
            kubectl kustomize .
      discover:
        find:
          glob: "**/kustomization.yaml"
---
# Patch argocd-repo-server: додає sidecar з sops + монтує age key
#
# Sidecar image: ghcr.io/jkroepke/helm-secrets/sops:latest
#   містить: sops, age, kubectl, kustomize
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      volumes:
        - name: sops-age-key
          secret:
            secretName: sops-age-key
        - name: cmp-plugin
          emptyDir: {}
        - name: cmp-tmp
          emptyDir: {}

      initContainers:
        - name: copy-cmp-plugin
          image: ghcr.io/jkroepke/helm-secrets/sops:3.8.1
          command: [cp, /usr/local/bin/sops, /custom-tools/sops]
          volumeMounts:
            - name: cmp-plugin
              mountPath: /custom-tools

      containers:
        # Sidecar CMP з sops
        - name: kustomize-sops
          image: ghcr.io/jkroepke/helm-secrets/sops:3.8.1
          command: [/var/run/argocd/argocd-cmp-server]
          env:
            - name: SOPS_AGE_KEY_FILE
              value: /sops-age-key/key.txt
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: sops-age-key
              mountPath: /sops-age-key
              readOnly: true
            - name: cmp-plugin
              mountPath: /usr/local/bin/sops
              subPath: sops
            - name: cmp-tmp
              mountPath: /tmp
            - mountPath: /var/run/argocd
              name: var-files
            - mountPath: /home/argocd/cmp-server/plugins
              name: plugins

      # Посилання на tomounts argocd-repo-server (існуючі)
      # (var-files та plugins вже є у стандартному argocd-repo-server deployment)
