---
# Sealed Secrets контролер
# Документація: https://github.com/bitnami-labs/sealed-secrets
#
# Після встановлення:
#   1. Отримати публічний ключ для шифрування:
#      kubeseal --fetch-cert \
#        --controller-name=sealed-secrets-controller \
#        --controller-namespace=kube-system \
#        > pub-sealed-secrets.pem
#
#   2. Зберегти pub-sealed-secrets.pem в безпечному місці команди
#      (наприклад, у внутрішньому wiki або password manager)
#      Цей файл НЕ секрет — він публічний, але потрібен для шифрування
#
#   3. Приватний ключ — в Secret "sealed-secrets-key" в kube-system
#      ЗРОБИТИ BACKUP: kubectl get secret sealed-secrets-key -n kube-system -o yaml
#      Зберегти backup в захищеному місці (не в Git!)

apiVersion: v1
kind: ServiceAccount
metadata:
  name: sealed-secrets-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: sealed-secrets-controller
    app.kubernetes.io/part-of: finpaybank
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sealed-secrets-controller
  labels:
    app.kubernetes.io/name: sealed-secrets-controller
    app.kubernetes.io/part-of: finpaybank
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, delete, watch]
  - apiGroups: [bitnami.com]
    resources: [sealedsecrets]
    verbs: [get, list, watch]
  - apiGroups: [bitnami.com]
    resources: [sealedsecrets/status]
    verbs: [update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sealed-secrets-controller
  labels:
    app.kubernetes.io/name: sealed-secrets-controller
    app.kubernetes.io/part-of: finpaybank
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sealed-secrets-controller
subjects:
  - kind: ServiceAccount
    name: sealed-secrets-controller
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sealed-secrets-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: sealed-secrets-controller
    app.kubernetes.io/part-of: finpaybank
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sealed-secrets-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sealed-secrets-controller
        app.kubernetes.io/part-of: finpaybank
    spec:
      serviceAccountName: sealed-secrets-controller
      automountServiceAccountToken: true  # контролер потребує K8s API доступу
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sealed-secrets-controller
          image: ghcr.io/bitnami-labs/sealed-secrets-controller:0.36.6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: metrics
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
          resources:
            # Буде override через kustomization.yaml patch
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sealed-secrets-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: sealed-secrets-controller
    app.kubernetes.io/part-of: finpaybank
spec:
  selector:
    app.kubernetes.io/name: sealed-secrets-controller
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 8081
      targetPort: 8081
---
# CRD для SealedSecret (спрощена версія — використовувати офіційний manifest)
# Для встановлення CRD окремо:
#   kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.26.2/controller.yaml
