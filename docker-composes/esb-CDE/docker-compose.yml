version: "3.9"

services:
  redis:
    image: redis:8
    container_name: redis
    restart: always
#    command: ["redis-server", "--appendonly", "yes"]
#    volumes:
#      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - app_network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
#    environment:
#      RABBITMQ_DEFAULT_USER: app
#      RABBITMQ_DEFAULT_PASS: app
    restart: always
    networks:
      - app_network

  es-transaction:
    image: elasticsearch:7.4.2
    container_name: es-transaction
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
#    ports:
#      - "9200:9200"
    networks:
      - app_network

  identity:
    image: hub.kapowai.com.ua/identity:25.09.3
    container_name: identity
    restart: always
    volumes:
      - ./settings.cfg:/app/settings/settings.cfg:ro
    depends_on:
      - redis
      - rabbitmq
    networks:
      - app_network

  cards:
    image: finpaybank.kapowai.com.ua/cards:latest
    container_name: cards
    restart: always
    volumes:
      - ./settings.cfg:/app/settings/settings.cfg:ro
      - ./cert.pem:/app/cert.pem:ro
      - ./key.pem:/app/key.pem:ro
      - ./hmac.txt:/app/hmac.txt:ro
      - ./ca.pem:/app/settings/ca.pem:ro
      - ./public.pem:/app/settings/public.pem:ro
    depends_on:
      - redis
      - rabbitmq
    networks:
      - app_network

  cards-worker:
    image: finpaybank.kapowai.com.ua/cards-worker:latest
    container_name: cards-worker
    restart: always
    volumes:
      - ./settings.cfg:/app/settings/settings.cfg:ro
    depends_on:
      - redis
      - rabbitmq
    networks:
      - app_network

  customer:
    image: finpaybank.kapowai.com.ua/customer:latest
    container_name: customer
    restart: always
    volumes:
      - ./settings.cfg:/app/settings/settings.cfg:ro
    depends_on:
      - redis
      - rabbitmq
    networks:
      - app_network

  banks:
    image: finpaybank.kapowai.com.ua/banks:latest
    container_name: banks
    restart: always
    volumes:
      - ./settings.cfg:/app/settings/settings.cfg:ro
    depends_on:
      - redis
      - rabbitmq
      - es-transaction
    networks:
      - app_network

  ukrcard:
    image: finpaybank.kapowai.com.ua/ukrcard:latest
    container_name: ukrcard
    restart: always
    volumes:
      - ./settings.cfg:/app/settings/settings.cfg:ro
      - ./cert.pem:/app/settings/cert.pem:ro
      - ./key.pem:/app/settings/key.pem:ro
      - ./hmac.txt:/app/settings/hmac.txt:ro
      - ./ca.pem:/app/settings/ca.pem:ro
      - ./public.pem:/app/settings/public.pem:ro
    depends_on:
      - redis
      - rabbitmq
    networks:
      - app_network

  banks-worker:
    image: finpaybank.kapowai.com.ua/banks-worker:latest
    container_name: banks-worker
    restart: always
    volumes:
      - ./settings.cfg:/app/settings/settings.cfg:ro
    depends_on:
